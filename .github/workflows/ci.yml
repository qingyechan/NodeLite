name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit and transaction tests
        run: python -B -m unittest discover -s terminal/tests -v

      - name: Verify installer and checksums
        run: |
          (cd dist && sha256sum -c nodelite.run.sha256)
          sh -n dist/nodelite.run

      - name: Publish Release assets on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/nodelite.run
            dist/nodelite.run.sha256
          generate_release_notes: true
